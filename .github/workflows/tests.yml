name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # Cancel superseded runs on PR updates only; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # No GPU and no generated assets: the smoke project makes its own (make_assets.py) and runs
  # the whole kit on a copy, as CLAUDE.md describes. Windows, the platform the kit targets.
  # The job name is the required status check.
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          command -v ffmpeg || choco install ffmpeg -y --no-progress
      - name: Kit and tools compile
        run: python -m compileall -q kit projects/_smoke
      - name: Smoke render (stills, segments, mix, finish)
        run: |
          export PYTHONPATH="$PWD/kit"
          T="$RUNNER_TEMP/smoke"; mkdir -p "$T"
          cp projects/_smoke/{project.json,shots.py} "$T/"
          python projects/_smoke/make_assets.py "$T"
          python -m animkit.render "$T" stills 1:0.5 2:50%
          python -m animkit.render "$T" all --workers 2
          python -m animkit.mix "$T"
          python -m animkit.finish "$T"
      - name: Pre-publish safety scan (files and history)
        run: |
          git fetch --unshallow --quiet || true
          python scripts/check_repo_safe.py --history
